name: Build Mihomo Tray

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Initialize Go module (auto-create go.mod / go.sum)
      shell: pwsh
      run: |
        if (-Not (Test-Path go.mod)) {
            go mod init mihomo_tray
        }
        go mod tidy

    - name: Install rsrc (for embedding EXE icon)
      run: go install github.com/akavel/rsrc@latest

    - name: Generate app.syso (EXE icon resource)
      run: rsrc -ico clash.ico -o app.syso

    - name: Build Windows EXE
      run: |
        go build -ldflags "-H=windowsgui -s -w" -o mihomo_tray.exe mihomo_tray.go

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: mihomo_tray_exe
        path: mihomo_tray.exe
