name: Build Mihomo Lite

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 v1.3.3）'
        required: true
        default: 'v1.3.3'
      compression_level:
        description: 'UPX 压缩等级'
        required: false
        default: 'ultra-brute'
        type: choice
        options:
          - ultra-brute
          - best
          - normal

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Initialize Go module and install dependencies
        shell: pwsh
        run: |
          if (-Not (Test-Path go.mod)) {
              go mod init mihomo_tray
          }
          
          go get github.com/getlantern/systray
          go get github.com/webview/webview_go
          go get gopkg.in/yaml.v3
          go get golang.org/x/sys/windows
          
          go mod tidy

      - name: Install rsrc (用于嵌入图标)
        run: go install github.com/akavel/rsrc@latest

      - name: Generate app.syso (嵌入程序图标)
        run: rsrc -arch amd64 -ico icon/logo.ico -o app.syso

      - name: Set Version
        id: set_version
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          echo "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "当前版本号: $ver"

      - name: Build Windows EXE
        run: |
          go build -trimpath `
            -ldflags "-H=windowsgui -s -w -X main.Version=${{ env.VERSION }}" `
            -o NetTray.exe .

      - name: Compress with UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: |
            NetTray.exe
          args: --${{ inputs.compression_level }} --lzma

      - name: Rename with Version
        shell: pwsh
        run: |
          $ver = "${{ env.VERSION }}".Replace('v','').Replace('/', '-').Replace(':', '-')
          Rename-Item -Path "NetTray.exe" -NewName "NetTray_${ver}.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NetTray_exe
          path: NetTray_*.exe

      - name: Show Build Result
        shell: pwsh
        run: |
          Write-Host "✅ 构建完成！" -ForegroundColor Green
          Get-ChildItem NetTray_*.exe | Select-Object Name, Length | Format-Table
