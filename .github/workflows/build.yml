name: Build Mihomo Tray

on:
  # 手动触发（推荐方式）
  workflow_dispatch:
    inputs:
      compression_level:
        description: 'UPX 压缩等级'
        required: false
        default: 'ultra-brute'
        type: choice
        options:
          - ultra-brute
          - best
          - normal

  # 可选：只有 push 到 main/master 时才自动构建（如果你以后需要）
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Initialize Go module
        shell: pwsh
        run: |
          if (-Not (Test-Path go.mod)) {
              go mod init mihomo_tray
          }
          go get github.com/getlantern/systray
          go mod tidy

      - name: Install rsrc (用于嵌入图标)
        run: go install github.com/akavel/rsrc@latest

      - name: Generate 64bit app.syso (嵌入 clash.ico)
        run: rsrc -arch amd64 -ico clash.ico -o app.syso

      - name: Build Windows EXE (极致优化)
        run: |
          go build -trimpath -ldflags "-H=windowsgui -s -w" -o mihomo_tray.exe .

      - name: Compress with UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: |
            mihomo_tray.exe
          args: --${{ inputs.compression_level || 'ultra-brute' }} --lzma

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: mihomo_tray_exe
          path: mihomo_tray.exe
