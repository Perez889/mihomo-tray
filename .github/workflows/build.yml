name: Build Mihomo Lite

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 v1.0.0）'
        required: true
        default: 'v1.0.0'
      compression_level:
        description: 'UPX 压缩等级'
        required: false
        default: 'ultra-brute'
        type: choice
        options:
          - ultra-brute
          - best
          - normal

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Initialize Go module and install dependencies
        shell: pwsh
        run: |
          if (-Not (Test-Path go.mod)) {
              go mod init mihomo_tray
          }
          
          go get github.com/getlantern/systray
          go get gopkg.in/yaml.v3
          go get golang.org/x/sys/windows
          
          go mod tidy

      - name: Install rsrc (用于嵌入图标)
        run: go install github.com/akavel/rsrc@latest

      - name: Generate 64bit app.syso (嵌入 clash.ico)
        run: rsrc -arch amd64 -ico icon/logo.ico -o app.syso

      - name: Set Version
        id: set_version
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          echo "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "当前版本号: $ver"

      # ============================
      # 构建托盘程序 NetTray.exe
      # ============================
      - name: Build Windows EXE (带版本号)
        run: |
          go build -trimpath -ldflags "-H=windowsgui -s -w -X main.Version=${{ env.VERSION }}" -o NetTray.exe .

      # ============================
      # ⭐ 新增：构建守护进程 NetTrayGuard.exe
      # ============================
      - name: Build NetTrayGuard.exe
        run: |
          go build -trimpath -ldflags "-s -w" -o NetTrayGuard.exe guard.go

      - name: Compress with UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: |
            NetTray.exe
          args: --${{ inputs.compression_level }} --lzma

      - name: Rename with Version
        shell: pwsh
        run: |
          $ver = "${{ env.VERSION }}".Replace('/', '-').Replace(':', '-')
          Rename-Item -Path "NetTray.exe" -NewName "NetTray_${ver}.exe"
          Rename-Item -Path "NetTrayGuard.exe" -NewName "NetTrayGuard_${ver}.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NetTray_exe
          path: |
            NetTray_*.exe
            NetTrayGuard_*.exe
